name: Enrichir les distributions des séries France
on:
  workflow_dispatch:
    inputs:
      max_titles:
        description: "Séries à enrichir (90 par défaut)"
        required: false
        default: "90"
  push:
    paths:
      - "scripts/sync-fr-cast.mjs"
      - ".github/workflows/sync-fr-cast.yml"
  schedule:
    - cron: "15 5 * * *"
permissions:
  contents: write
concurrency:
  group: sync-fr-cast-cache
  cancel-in-progress: false
jobs:
  casting:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Actualiser le casting des séries certifiées France
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MAX_CAST_TITLES: ${{ inputs.max_titles || '90' }}
        run: node scripts/sync-fr-cast.mjs
      - name: Publier les distributions vérifiées sans secret
        run: |
          git add data/cast-fr.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: actualiser la distribution des séries France"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Casting déjà à jour."
          fi
