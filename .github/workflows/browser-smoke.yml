name: Recette navigateur SériesClubTCG V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "v*/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "v*/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Installer Chromium de test (sans effet sur le jeu)
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Démarrer le site statique
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/seriesclub-browser.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Tester les parcours sur mobile et ordinateur
        run: node tests/browser-smoke.mjs
      - name: Captures de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serieclub-v1-browser-smoke
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
