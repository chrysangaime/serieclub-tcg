name: Enrichir le catalogue de séries diffusées en France
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages TMDB à examiner (1-60, 20 par défaut)"
        required: false
        default: "20"
      budget:
        description: "Titres à vérifier (1-1000, 400 par défaut)"
        required: false
        default: "400"
      start_page:
        description: "Page de départ facultative (sinon reprise automatique)"
        required: false
        default: ""
  # Pause juridique V1 : pas d'appel automatique à TMDB.
  # Déclenchement manuel uniquement pour essais non commerciaux documentés.
permissions:
  contents: write
concurrency:
  group: sync-fr-providers
  cancel-in-progress: false
jobs:
  enrichir:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Vérifier et importer les séries prouvées diffusées en France
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://anjfidksqbqlaggttdop.supabase.co
          FR_DISCOVERY_PAGES: ${{ inputs.pages || '20' }}
          FR_DISCOVERY_BUDGET: ${{ inputs.budget || '400' }}
          FR_START_PAGE: ${{ inputs.start_page || '' }}
        run: node scripts/expand-fr-catalog.mjs
      - name: Conserver les preuves et le point de reprise
        run: |
          if ! git diff --quiet -- data/watch-fr.json data/catalog-fr-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/watch-fr.json data/catalog-fr-state.json
            git commit -m "data: enrichir le catalogue confirmé France"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Pas de nouvelles données françaises."
          fi
